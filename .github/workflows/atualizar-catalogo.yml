name: Atualizar catálogo do JavasMapGTAVI

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-catalogo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Buscar catálogo comunitário
        run: |
          mkdir -p data
          curl --fail --location --silent --show-error \
            "https://fbritoferreira.github.io/gta6/data/locations.json" \
            -o /tmp/locations.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/locations.json','utf8')); if(!Array.isArray(d)) throw new Error('Formato inesperado do catálogo'); console.log('Pontos recebidos:',d.length)"
          cp /tmp/locations.json data/locations.json

      - name: Usar catálogo versionado pelo projeto
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'index.html';
          let html = fs.readFileSync(file, 'utf8');
          const remote = "https://fbritoferreira.github.io/gta6/data/locations.json";
          if (html.includes(remote)) {
            html = html.replace(remote, './data/locations.json');
            fs.writeFileSync(file, html);
          }
          NODE

      - name: Publicar somente se houver novidades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/locations.json index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no catálogo."
            exit 0
          fi
          git commit -m "Atualiza catálogo comunitário automaticamente"
          git push
